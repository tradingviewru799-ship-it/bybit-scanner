name: BingX Method 3 Scanner

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Run scanner
        env:
          GMAIL_USER:        ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASS:    ${{ secrets.GMAIL_APP_PASS }}
          ALERT_EMAIL:       ${{ secrets.ALERT_EMAIL }}
          STRATEGY_METHOD:   '3'
          M3_MAX_DISTANCE:   ${{ vars.M3_MAX_DISTANCE || '30' }}
          M3_REQUIRE_4H_T:   ${{ vars.M3_REQUIRE_4H_T || 'false' }}
          SCAN_TOP_N:        ${{ vars.SCAN_TOP_N || '300' }}
        run: node scanner.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: signal-state
          path: signal-state.json
          retention-days: 2
          overwrite: true
